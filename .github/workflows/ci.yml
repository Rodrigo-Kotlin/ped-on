name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Audit PWA precache
        run: pnpm audit:precache

      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          ./gitleaks git --redact --log-level warn .

  e2e:
    name: E2E smoke tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @pedon/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  backend:
    name: Backend release gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration history
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260812030000_prompt10_release_hardening.sql
          test -f supabase/migrations/20260812090000_prompt10_final_integrity_hardening.sql
          test -f supabase/migrations/20260812120000_prompt11_pilot_readiness_team.sql
          test -f supabase/migrations/20260813120000_prompt11_readiness_unit_coherence.sql
          test -f supabase/migrations/20260814000000_prompt12_product_options.sql
          test -f supabase/migrations/20260814010000_prompt12_final_hardening.sql
          test -f supabase/migrations/20260814020000_prompt12_remediation_a_hardening.sql
          test -f supabase/migrations/20260814100000_prompt13_backend_operational_core.sql
          versions=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | cut -d_ -f1)
          test "$(printf '%s\n' "$versions" | wc -l)" -eq "$(printf '%s\n' "$versions" | sort -u | wc -l)"
          test "$(printf '%s\n' "$versions" | grep -Ec '^[0-9]{14}$')" -eq "$(printf '%s\n' "$versions" | wc -l)"
          test "$(printf '%s\n' "$versions" | wc -l)" -eq 23

      - name: Rebuild database from migrations
        run: >-
          supabase start
          --exclude edge-runtime,gotrue,imgproxy,kong,logflare,mailpit,postgres-meta,postgrest,realtime,storage-api,studio,supavisor,vector
          --ignore-health-check

      - name: Verify local migration alignment
        shell: bash
        run: |
          set -euo pipefail
          output=$(supabase migration list --local)
          printf '%s\n' "$output"
          test "$(printf '%s\n' "$output" | grep -c '20260814000000.*20260814000000')" -eq 1
          test "$(printf '%s\n' "$output" | grep -c '20260814010000.*20260814010000')" -eq 1
          test "$(printf '%s\n' "$output" | grep -c '20260814020000.*20260814020000')" -eq 1
          test "$(printf '%s\n' "$output" | grep -c '20260814100000.*20260814100000')" -eq 1

      - name: Database lint
        run: supabase db lint --local --level error --fail-on error

      - name: Database integration suites
        run: pnpm test:db

      - name: Edge unit tests
        run: pnpm test:edge

      - name: Stop isolated database
        if: ${{ always() }}
        run: supabase stop --no-backup
